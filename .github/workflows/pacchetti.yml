# Pacchetti dell'app senza Python da installare: Windows (.exe), macOS Apple Silicon e Intel (.app), Linux.
# Ogni push su main li costruisce e li prova (scaricabili dagli artefatti dell'esecuzione);
# un tag v* (es. v1.0.0) li pubblica anche nella release di quel tag.
name: pacchetti

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # per allegare i pacchetti alla release

jobs:
  pacchetto:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: OpenRepertoire-Windows.zip
          - os: macos-latest
            asset: OpenRepertoire-macOS-AppleSilicon.zip
          - os: macos-15-intel
            asset: OpenRepertoire-macOS-Intel.zip
          - os: ubuntu-22.04     # glibc piu' vecchia: il pacchetto gira anche sulle distribuzioni meno recenti
            asset: OpenRepertoire-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Pacchetto
        run: pyinstaller packaging/openrepertoire.spec --noconfirm

      # Prova vera: si avvia il pacchetto, deve rispondere con pagina, file statici e API, poi si chiude
      - name: Prova (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          export OPENREP_NO_BROWSER=1 OPENREP_DATA_DIR="$RUNNER_TEMP/dati"
          B=dist/OpenRepertoire; [ "$RUNNER_OS" = macOS ] && B=dist/OpenRepertoire.app/Contents/MacOS/OpenRepertoire
          "$B" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5001/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:5001/api/ping || { cat "$OPENREP_DATA_DIR/openrepertoire.log"; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:5001/
          curl -sf -o /dev/null http://127.0.0.1:5001/static/js/personal.js
          curl -sf http://127.0.0.1:5001/api/endgames | grep -q Lucena
          curl -sf -X POST http://127.0.0.1:5001/api/quit
      - name: Prova (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPENREP_NO_BROWSER = '1'
          $env:OPENREP_DATA_DIR = "$env:RUNNER_TEMP\dati"
          Start-Process dist\OpenRepertoire.exe
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) { try { Invoke-RestMethod http://127.0.0.1:5001/api/ping | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content "$env:OPENREP_DATA_DIR\openrepertoire.log" -ErrorAction SilentlyContinue; exit 1 }
          Invoke-WebRequest http://127.0.0.1:5001/ -UseBasicParsing | Out-Null
          Invoke-WebRequest http://127.0.0.1:5001/static/js/personal.js -UseBasicParsing | Out-Null
          if (-not ((Invoke-WebRequest http://127.0.0.1:5001/api/endgames -UseBasicParsing).Content -match 'Lucena')) { exit 1 }
          Invoke-RestMethod -Method Post http://127.0.0.1:5001/api/quit | Out-Null

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir pkg && ditto dist/OpenRepertoire.app pkg/OpenRepertoire.app && cp LICENSE pkg/
          ditto -c -k --sequesterRsrc pkg "${{ matrix.asset }}"   # metadati in __MACOSX: con qualsiasi unzip la firma resta valida
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\OpenRepertoire.exe, LICENSE -DestinationPath "${{ matrix.asset }}"
      - name: Archivio (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" LICENSE -C dist OpenRepertoire   # tar conserva il permesso di esecuzione
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
